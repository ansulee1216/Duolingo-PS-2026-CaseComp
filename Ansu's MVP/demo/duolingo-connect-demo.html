 plans",userSay:"¿Qué plan hay para este finde, Lily? ¿Salimos de tapeo?",reply:'I was planning to stare at my ceiling and listen to indie rock, but tapas sound tolerable. Good use of "finde".',tip:'"Finde" = fin de semana (weekend).'},{label:"Compliment her sweater",userSay:"Me flipa tu suéter morado, te queda genial.",reply:'Obviously. I wear it every single day. "Me flipa" gets you bonus street cred, though.',tip:'"Me flipa" = I love it.'}],peers:[{name:"Maya",country:"🇪🇸 Spain",level:"Native speaker",preset:0,voice:{pitch:1.15,rate:1},greeting:"¡Hola! Qué ilusión hablar con alguien en vivo. ¿Qué tal va tu día?",topics:[{label:"How your day is going",userSay:"¡Hola Maya! Todo súper bien, con muchas ganas de practicar.",reply:'¡Qué guay! Se te entiende clarísimo. Aquí en Madrid decimos "en plan" y "mola mazo" todo el tiempo.',tip:`"Mola mazo" = it's really cool (Spain).`},{label:"Ask about music",userSay:"¡Me encanta tu avatar! ¿Qué música escuchas normalmente?",reply:"¡Jaja, gracias! Escucho mucho a Rosalía y C. Tangana. ¿Y tú qué sueles escuchar?"},{label:"Favorite food",userSay:"¿Cuál es tu plato favorito para comer con amigos?",reply:"Sin duda unas bravas y tortilla española en una terraza. ¡Cuando vengas te invito!"}]},{name:"Mateo",country:"🇲🇽 Mexico",level:"Native speaker",preset:1,voice:{pitch:.9,rate:1.02},greeting:"¡Qué onda! Estoy en mi descanso. ¿Practicamos un poco de slang mexicano?",topics:[{label:"Taco recommendations",userSay:"¡Qué onda, Mateo! ¿Cuáles son los mejores tacos de tu ciudad?",reply:"¡No manches, los de pastor en la noche están buenísimos! Tu pronunciación suena súper natural.",tip:'"No manches" = no way! (Mexico).'},{label:"Concerts",userSay:"¡Está padrísimo tu gorro! ¿Has ido a algún concierto últimamente?",reply:'¡Qué chido que dijiste "padrísimo"! Fui al Vive Latino el mes pasado, estuvo increíble.',tip:'"Padrísimo" / "chido" = awesome (Mexico).'}]},{name:"Diego",country:"🇦🇷 Argentina",level:"Native speaker",preset:2,voice:{pitch:.8,rate:1},greeting:"¡Che, qué tal! Qué copado conectar en vivo. ¿De dónde sos?",topics:[{label:"Argentine slang",userSay:'¡Hola Diego! Siempre escucho "che" y "copado". ¿Qué más dicen allá?',reply:'¡Jaja, re bien! Decimos "re" para todo y "un montón". ¡Te sale bárbaro el acento!',tip:'"Re" = very (Argentina) — "re bien", "re lindo".'},{label:"Football",userSay:"¿Cómo se vive el fútbol allá en Buenos Aires?",reply:"Es una locura total, los domingos se para todo el país. ¡Sigamos charlando!"}]}]},{code:"JA",name:"Japanese",flag:"🇯🇵",speechLang:"ja-JP",voicePreview:"はじめまして！よろしくね。",guardDemo:"インスタ @alex_tokyo をフォローしてね！電話は 090-1234-5678 だよ。",lilyGreeting:"Yahho. Textbooks make everyone sound like a 19th-century samurai. Show me you can chat casually in Tokyo.",lilyTopics:[{label:"Quick konbini run",userSay:"ちょっとコンビニ行ってくるね！何かいる？ (Chotto konbini itte kuru ne! Nani ka iru?)",reply:'Ooh, dropping particles naturally. Grab me a melonpan. Your pitch accent on "konbini" was spot on.',tip:"Dropping は/を in casual speech sounds much more natural."},{label:'React with "maji de?"',userSay:"えっ、マジで？それめっちゃヤバいね！ (E, maji de? Sore meccha yabai ne!)",reply:'"Maji de" and "meccha yabai"… congratulations, you officially speak fluent Harajuku teenager.',tip:'"めっちゃヤバい" = super crazy / amazing, depending on tone.'}],peers:[{name:"Kenji",country:"🇯🇵 Japan",level:"Native speaker",preset:1,voice:{pitch:.9,rate:1},greeting:"ヤッホー！ライブで話せて嬉しいよ。最近どう？ (Yahho! Great to talk live. How have you been?)",topics:[{label:"Anime & gaming",userSay:"ヤッホー、けんじ！最近は日本のアニメをよく見てるよ。 (Lately I watch a lot of anime.)",reply:"いいね！発音がすごく綺麗だよ。 (Nice! Your pronunciation is really clean.)"},{label:"Tokyo ramen",userSay:"東京で一番おすすめのラーメン屋さんはどこ？ (Best ramen spot in Tokyo?)",reply:"新宿の豚骨ラーメンがめっちゃうまいよ！ (The tonkotsu in Shinjuku is so good!)"}]},{name:"Sora",country:"🇯🇵 Japan",level:"Native speaker",preset:0,voice:{pitch:1.2,rate:1},greeting:"まいど！大阪からやで。気軽にしゃべろう！ (Hey from Osaka! Let's chat casually!)",topics:[{label:"Try Kansai-ben",userSay:"めっちゃ楽しそう！関西弁ってほんまに素敵やね。 (Kansai dialect is really lovely.)",reply:"うわ、「ほんまに」って言ってくれた！イントネーション完璧やん！ (Your intonation is perfect!)",tip:'"ほんまに" = 本当に (really) in Kansai dialect.'}]}]},{code:"ZH",name:"Chinese",flag:"🇨🇳",speechLang:"zh-CN",voicePreview:"你好！很高兴认识你。",guardDemo:"加我微信吧，我的手机号是 138-1234-5678！",lilyGreeting:"Nǐ hǎo. Everyone says tones are the hardest part — so let's test all four in a real chat.",lilyTopics:[{label:"Order boba with tones",userSay:"老板，我要一杯少冰半糖的珍珠奶茶！ (Wǒ yào yī bēi shǎo bīng bàn táng de zhēnzhū nǎichá!)",reply:'Third tone on "shǎo," fourth on "bàn" — crystal clear. You actually get your boba.',tip:"3rd → 4th tone: shǎo bīng bàn táng."},{label:'Use "juéjuézǐ"',userSay:"这家店的奶茶真的绝绝子！ (Zhè jiā diàn de nǎichá zhēn de juéjuézǐ!)",reply:'Did you just say "juéjuézǐ"? You spend way too much time on Xiaohongshu. Respect.',tip:"绝绝子 (juéjuézǐ) = absolutely iconic."}],peers:[{name:"Lin",country:"🇹🇼 Taiwan",level:"Native speaker",preset:0,voice:{pitch:1.15,rate:1},greeting:"哈啰！很高兴跟你连线练习中文，你今天过得怎么样？ (Hi! How is your day going?)",topics:[{label:"Night markets",userSay:"哈啰！我超想去台北夜市吃小吃！ (I really want to try Taipei night markets!)",reply:"哈哈，你的四声发音非常标准！ (Your four tones are really accurate!)"},{label:"Mandopop",userSay:"你平时喜欢听周杰伦的歌吗？ (Do you like Jay Chou?)",reply:'超喜欢！每次去KTV必点《晴天》。 (Love him! I always sing "Sunny Day" at KTV.)'}]}]}],_1=`

  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');
  .duo-font { font-family: 'Nunito', 'DIN Next Rounded', ui-rounded, system-ui, sans-serif; }
  .duo-btn {
    border-radius: 16px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.06em; transition: transform .08s ease, box-shadow .08s ease, filter .15s ease;
    user-select: none;
  }
  .duo-btn:hover { filter: brightness(1.05); }
  .duo-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 0 transparent !important; }
  .duo-btn:disabled { cursor: default; filter: none; }
  .duo-green  { background: ${c.feather}; color: #fff; box-shadow: 0 4px 0 ${c.featherDark}; }
  .duo-blue   { background: ${c.macaw};   color: #fff; box-shadow: 0 4px 0 ${c.macawDark}; }
  .duo-purple { background: ${c.beetle};  color: #fff; box-shadow: 0 4px 0 ${c.beetleDark}; }
  .duo-red    { background: ${c.cardinal};color: #fff; box-shadow: 0 4px 0 ${c.cardinalDark}; }
  .duo-white  { background: #fff; color: ${c.macaw}; border: 2px solid ${c.swan}; box-shadow: 0 4px 0 ${c.swan}; }
  .duo-ghost-dark { background: transparent; color: #fff; border: 2px solid ${c.nightBorder}; box-shadow: 0 4px 0 ${c.nightBorder}; }
  .duo-disabled { background: ${c.swan}; color: ${c.hare}; box-shadow: 0 4px 0 #CECECE; }
  .duo-card {
    background: #fff; border: 2px solid ${c.swan}; border-radius: 16px; box-shadow: 0 4px 0 ${c.swan};
  }
  .duo-card-press { transition: transform .08s ease, box-shadow .08s ease; cursor: pointer; }
  .duo-card-press:active { transform: translateY(4px); box-shadow: 0 0 0 0 transparent; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }

  @keyframes duoTalk { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
  .duo-talk { animation: duoTalk .45s ease-in-out infinite; transform-box: fill-box; }
  @keyframes popIn { 0% { transform: scale(.6); opacity: 0 } 70% { transform: scale(1.06) } 100% { transform: scale(1); opacity: 1 } }
  .pop-in { animation: popIn .38s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes slideUp { from { transform: translateY(100%) } to { transform: translateY(0) } }
  .slide-up { animation: slideUp .32s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  .fade-in { animation: fadeIn .25s ease both; }
  @keyframes riseIn { from { transform: translateY(8px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
  .rise-in { animation: riseIn .28s ease both; }
  @keyframes ring { 0% { transform: scale(.85); opacity: .55 } 100% { transform: scale(1.9); opacity: 0 } }
  .ring-pulse { animation: ring 1.8s ease-out infinite; }
  @keyframes floaty { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  .floaty { animation: floaty 2.2s ease-in-out infinite; }
  @keyframes eq { 0%,100% { transform: scaleY(.35) } 50% { transform: scaleY(1) } }
  .eq-bar { transform-origin: bottom; animation: eq .7s ease-in-out infinite; }
  @keyframes dots { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
  .dot { animation: dots 1.2s infinite; }
  @keyframes speakRing { 0% { transform: scale(.92); opacity: .9 } 100% { transform: scale(1.25); opacity: 0 } }
  .speak-ring { animation: speakRing 1s ease-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  .twinkle { animation: twinkle 1.6s ease-in-out infinite; }
  @keyframes flicker { 0% { transform: scaleY(1) } 100% { transform: scaleY(.82) skewX(3deg) } }
  .flicker { animation: flicker .35s ease-in-out infinite alternate; transform-origin: 360px 76px; }
  .super-grad { background: linear-gradient(100deg, #26F4C0 0%, #2B9BFF 38%, #A960FF 70%, #FF6BD6 100%); }
  .super-text { background: linear-gradient(100deg, #26F4C0 0%, #2B9BFF 38%, #A960FF 70%, #FF6BD6 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .super-chip { font-size: 10px; font-weight: 900; letter-spacing: .08em; color: #fff; padding: 2px 7px; border-radius: 8px; background: linear-gradient(100deg, #2B9BFF, #A960FF 60%, #FF6BD6); }
  .duo-super { color: #fff; background: linear-gradient(100deg, #2B9BFF 0%, #A960FF 60%, #FF6BD6 100%); box-shadow: 0 4px 0 #6A3FC4; }
